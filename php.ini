[PHP]
; El lanzador obtiene extension_dir desde la ubicación de php.exe.
extension_dir="ext"
extension=openssl
extension=mbstring
extension=pdo_pgsql
extension=pgsql
extension=curl
extension=fileinfo
extension=gd
extension=intl
date.timezone=America/Guayaquil
upload_max_filesize=10M
post_max_size=16M
memory_limit=256M
display_errors=Off
log_errors=On
