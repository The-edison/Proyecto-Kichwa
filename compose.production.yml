services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_URL: ${PUBLIC_URL:-https://yachay-kichwa.devs-ueb.tech}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Yachay
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Configura APP_KEY en Dokploy}
      APP_DEBUG: "false"
      APP_URL: ${PUBLIC_URL:-https://yachay-kichwa.devs-ueb.tech}
      FRONTEND_URL: ${PUBLIC_URL:-https://yachay-kichwa.devs-ueb.tech}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      TRUSTED_PROXIES: "*"
      SANCTUM_STATEFUL_DOMAINS: yachay-kichwa.devs-ueb.tech
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-yachay_kichwa}
      DB_USERNAME: ${DB_USERNAME:-yachay_app}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en Dokploy}
      SESSION_DRIVER: database
      SESSION_LIFETIME: "30"
      SESSION_EXPIRE_ON_CLOSE: "true"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-administracion@devs-ueb.tech}
      MAIL_FROM_NAME: Yachay
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://yachay-kichwa.devs-ueb.tech/auth/google/callback
      KICHWA_CHECK_EMAIL_DNS: "true"
      KICHWA_CHECK_BREACHED_PASSWORDS: "true"
      YACHAY_PRIVACY_EMAIL: ${YACHAY_PRIVACY_EMAIL:-kichwa.soporte@gmail.com}
      YACHAY_PRIVACY_RESPONSIBLE: ${YACHAY_PRIVACY_RESPONSIBLE:-}
      YACHAY_PRIVACY_ADDRESS: ${YACHAY_PRIVACY_ADDRESS:-}
      YACHAY_PRIVACY_PHONE: ${YACHAY_PRIVACY_PHONE:-}
      YACHAY_PRIVACY_LEGAL_BASIS: ${YACHAY_PRIVACY_LEGAL_BASIS:-}
      YACHAY_PRIVACY_RETENTION: ${YACHAY_PRIVACY_RETENTION:-}
    volumes:
      - media:/var/www/backend/storage/app/public
      - app_private:/var/www/backend/storage/app/private
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-yachay_kichwa}
      POSTGRES_USER: ${DB_USERNAME:-yachay_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en Dokploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  media:
  app_private:
