e"><tspan x="1800" y="1436.6">implementa</tspan></text><polyline points="2575,1570 2575,1320" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#triangle)"/><rect x="2523" y="1432" width="104" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2575" y="1456.6">extiende</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="start"><tspan x="100" y="1068.4">Estrategias disponibles · Referencias repetidas de las mismas clases base y del mismo contrato</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="2010.8">Contrato: Illuminate\Contracts\Hashing\Hasher. El algoritmo activo no fue determinado; se muestran implementaciones disponibles.</tspan><tspan x="70" y="2043">Argon2IdHasher hereda de ArgonHasher. Este diagrama no atribuye Strategy a ContratoEjercicio ni a la calificación.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="2107.6">UML: triángulo vacío continuo = herencia; triángulo vacío discontinuo = implementación; flecha discontinua = dependencia.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="122" y="2169.6">Yachay</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="662" y="2169.6">Laravel / Sanctum</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1202" y="2169.6">Dependencia externa</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1872" y="2169.6">Flujo / explicación</tspan></text></svg>