<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2080" viewBox="0 0 3000 2080" role="img" aria-label="Observer"><title>Yachay · Observer</title><defs><marker id="open" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#334B5E" stroke-width="2.5"/></marker><marker id="triangle" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="20" markerHeight="20" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L19,10 L1,19 Z" fill="#FFFFFF" stroke="#334B5E" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#182B3A" text-anchor="start"><tspan x="70" y="90.6">Observer</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="158.5">Implementación funcional del frontend · Suscripción, aviso, lectura y cancelación</tspan></text><rect x="1300" y="210" width="1600" height="1550" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2" stroke-dasharray="10 8"/><text font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#182B3A" text-anchor="start"><tspan x="1325" y="252.8">guidedAttempt.ts · sujeto observable (módulo funcional)</tspan></text><rect x="70" y="2000" width="35" height="26" fill="#E9F5EC" stroke="#285C3C" stroke-width="2" /><rect x="610" y="2000" width="35" height="26" fill="#EAF1FC" stroke="#285382" stroke-width="2" /><rect x="1150" y="2000" width="35" height="26" fill="#F3EDFC" stroke="#62418B" stroke-width="2" /><rect x="1820" y="2000" width="35" height="26" fill="#F6F8FA" stroke="#52606D" stroke-width="2" /><rect x="100" y="300" width="650" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="425" y="341.4">GuidedUnit</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="380.6">Cliente del almacén</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="438.4">Usa useSyncExternalStore()</tspan><tspan x="425" y="472">Proporciona el callback de React</tspan></text><rect x="1400" y="300" width="650" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="341.4">subscribeGuidedAttempt()</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="380.6">Operación de suscripción</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="455.2">Registra el callback para una clave</tspan></text><rect x="2250" y="300" width="550" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2525" y="341.4">listeners</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2525" y="380.6">Registro de observadores</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2525" y="438.4">Mapa de conjuntos de callbacks</tspan><tspan x="2525" y="472">Suscriptores separados por clave</tspan></text><rect x="100" y="660" width="650" height="180" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="425" y="701.4">GuidedUnit</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="740.6">Emisor de cambios</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="805.2">Actualiza el intento guiado</tspan></text><rect x="1400" y="700" width="650" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="741.4">writeGuidedAttempt()</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="780.6">Operación de actualización</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="838.4">Actualiza el estado</tspan><tspan x="1725" y="872">Notifica a los suscriptores</tspan></text><rect x="2250" y="700" width="550" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2525" y="741.4">drafts</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2525" y="780.6">Estado observado</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2525" y="838.4">Mapa de intentos por clave</tspan><tspan x="2525" y="872">Respaldo auxiliar en sessionStorage</tspan></text><rect x="100" y="1100" width="650" height="200" rx="12" fill="#F3EDFC" stroke="#62418B" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="425" y="1141.4">Callback suscrito</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="1180.6">Observador concreto</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="1238.4">React solicita un nuevo snapshot</tspan><tspan x="425" y="1272">La vista utiliza el estado actualizado</tspan></text><rect x="1400" y="1100" width="650" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="1141.4">readGuidedAttempt()</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="1180.6">Operación de lectura</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="1255.2">Devuelve el snapshot del intento</tspan></text><rect x="100" y="1500" width="650" height="180" rx="12" fill="#F3EDFC" stroke="#62418B" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="425" y="1541.4">Limpieza de la suscripción</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="1580.6">Ciclo de vida de React</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="1645.2">Ejecuta la cancelación recibida</tspan></text><rect x="1400" y="1500" width="650" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="1541.4">Función de cancelación</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="1580.6">Closure devuelta al suscribirse</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1725" y="1638.4">Retira el callback del conjunto</tspan><tspan x="1725" y="1672">Elimina el registro si queda vacío</tspan></text><polyline points="750,400 1400,400" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="951.5" y="352" width="247" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1075" y="376.6">1 · registra callback</tspan></text><polyline points="2050,400 2250,400" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2110" y="352" width="80" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2150" y="376.6">añade</tspan></text><polyline points="1725,500 1725,560 425,560 425,500" fill="none" stroke="#334B5E" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#open)"/><rect x="882" y="542" width="236" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1000" y="566.6">devuelve cancelación</tspan></text><polyline points="750,750 1400,750" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="962.5" y="702" width="225" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1075" y="726.6">2 · escribe intento</tspan></text><polyline points="2050,800 2250,800" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2109" y="752" width="82" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2150" y="776.6">guarda</tspan></text><polyline points="1920,700 1920,620 2525,620 2525,500" fill="none" stroke="#334B5E" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#open)"/><rect x="2196.5" y="602" width="247" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2320" y="626.6">consulta suscriptores</tspan></text><polyline points="1400,850 1100,850 1100,1150 750,1150" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="987.5" y="982" width="225" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1100" y="1006.6">3 · notifica cambio</tspan></text><polyline points="750,1250 1400,1250" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="951.5" y="1232" width="247" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1075" y="1256.6">4 · solicita snapshot</tspan></text><polyline points="2050,1200 2525,1200 2525,900" fill="none" stroke="#334B5E" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#open)"/><rect x="2462" y="1032" width="126" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2525" y="1056.6">lee estado</tspan></text><polyline points="750,1590 1400,1590" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="940.5" y="1572" width="269" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1075" y="1596.6">5 · cancela suscripción</tspan></text><polyline points="2050,1600 2850,1600 2850,400 2800,400" fill="none" stroke="#334B5E" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#open)"/><rect x="2759.5" y="1332" width="181" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2850" y="1356.6">retira callback</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="1860.8">Los bloques representan módulos, datos y funciones existentes; no se introducen clases Observer o Subject.</tspan><tspan x="70" y="1893">La notificación es síncrona; la lectura del estado sigue el modelo pull de useSyncExternalStore().</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="1957.6">Notación funcional: flecha continua = llamada / notificación; discontinua = dependencia; retorno = resultado de una operación.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="122" y="2019.6">Yachay</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="662" y="2019.6">Laravel / Sanctum</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1202" y="2019.6">Dependencia externa</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1872" y="2019.6">Flujo / explicación</tspan></text></svg>