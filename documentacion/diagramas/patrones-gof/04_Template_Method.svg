iddle"><tspan x="450" y="991.4">RegisterRequest</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="450" y="1030.6">Solicitud concreta · registro</tspan></text><path d="M100,1051 H800" stroke="#285C3C" stroke-width="2"/><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="450" y="1109.8">prepareForValidation() · normaliza</tspan><tspan x="450" y="1143.3999999999999">authorize() · permite registro</tspan><tspan x="450" y="1177">rules() · define restricciones</tspan><tspan x="450" y="1210.6">messages() y attributes()</tspan></text><rect x="1200" y="950" width="750" height="310" rx="0" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1575" y="991.4">SaveKichwaContentRequest</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1575" y="1030.6">Solicitud concreta · contenidos</tspan></text><path d="M1200,1051 H1950" stroke="#285C3C" stroke-width="2"/><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1575" y="1126.6">authorize() · exige administrador</tspan><tspan x="1575" y="1160.1999999999998">rules() · valida el recurso</tspan><tspan x="1575" y="1193.8">messages() · personaliza mensajes</tspan></text><rect x="2300" y="950" width="700" height="310" rx="0" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2650" y="991.4">SaveTestimonialRequest</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2650" 