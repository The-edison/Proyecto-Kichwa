xt font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="925" y="1950.6">Interrupción del proceso</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="925" y="2005.2">Rechaza la solicitud</tspan></text><rect x="1900" y="1870" width="450" height="160" rx="12" fill="#EAF1FC" stroke="#285382" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2125" y="1911.4">failedValidation()</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2125" y="1950.6">Interrupción del proceso</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2125" y="2005.2">Informa errores de validación</tspan></text><polyline points="800,360 1200,360" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="882" y="312" width="236" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1000" y="336.6">activa la validación</tspan></text><polyline points="1950,360 2300,360" fill="none" stroke="#334B5E" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#open)"/><rect x="2067.5" y="312" width="115" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2125" y="336.6">usa trait</tspan></text><polyline points="450,950 450,700 1350,700 1350,500" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#triangle)"/><rect x="798" y="682" width="104" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="850" y="706.6">extiende</tspan></text><polyline points="1575,950 1575,500" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#triangle)"/><rect x="1523" y="682" width="104" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1575" y="706.6">extiende</tspan></text><polyline points="2650,950 2650,700 1800,700 1800,500" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#triangle)"/><rect x="2148" y="682" width="104" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2200" y="706.6">extiende</tspan></text><polyline points="550,1620 700,1620" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="573" y="1572" width="104" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="625" y="1596.6">continúa</tspan></text><polyline points="1150,1620 1300,1620" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="1173" y="1572" width="104" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1225" y="1596.6">autoriza</tspan></text><polyline points="1750,1620 1900,1620" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="1784" y="1572" width="82" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1825" y="1596.6">evalúa</tspan></text><polyline points="2350,1620 2500,1620" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2356.5" y="1572" width="137" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2425" y="1596.6">sin errores</tspan></text><polyline points="925,1710 925,1870" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="856.5" y="1772" width="137" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="925" y="1796.6">no autoriza</tspan></text><polyline points="2125,1710 2125,1870" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2056.5" y="1772" width="137" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2125" y="1796.6">con errores</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="start"><tspan x="100" y="1408.4">Secuencia común de validateResolved() · Camino principal; se omite la rama de precognición</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="2210.8">El trait aporta validateResolved(); FormRequest lo incorpora, y las solicitudes propias heredan de FormRequest.</tspan><tspan x="70" y="2243">Las reglas concretas se obtienen mediante validationRules(); authorize() es invocado por passesAuthorization().</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="2307.6">UML: triángulo vacío = herencia; dependencia «usa trait» = incorporación del trait. La franja inferior representa flujo, no clases nuevas.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="122" y="2369.6">Yachay</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="662" y="2369.6">Laravel / Sanctum</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1202" y="2369.6">Dependencia externa</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1872" y="2369.6">Flujo / explicación</tspan></text></svg>