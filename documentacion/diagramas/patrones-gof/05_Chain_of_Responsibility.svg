<svg xmlns="http://www.w3.org/2000/svg" width="3100" height="2940" viewBox="0 0 3100 2940" role="img" aria-label="Chain of Responsibility"><title>Yachay · Chain of Responsibility</title><defs><marker id="open" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#334B5E" stroke-width="2.5"/></marker><marker id="triangle" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="20" markerHeight="20" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L19,10 L1,19 Z" fill="#FFFFFF" stroke="#334B5E" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#182B3A" text-anchor="start"><tspan x="70" y="90.6">Chain of Responsibility</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="158.5">Ejemplo real: GET /api/admin/overview · KichwaAdminController::overview()</tspan></text><rect x="70" y="2860" width="35" height="26" fill="#E9F5EC" stroke="#285C3C" stroke-width="2" /><rect x="610" y="2860" width="35" height="26" fill="#EAF1FC" stroke="#285382" stroke-width="2" /><rect x="1150" y="2860" width="35" height="26" fill="#F3EDFC" stroke="#62418B" stroke-width="2" /><rect x="1820" y="2860" width="35" height="26" fill="#F6F8FA" stroke="#52606D" stroke-width="2" /><rect x="1000" y="250" width="900" height="180" rx="12" fill="#F6F8FA" stroke="#52606D" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="291.4">Solicitud HTTP</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="330.6">Petición del cliente</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="395.2">Acceso al resumen administrativo</tspan></text><rect x="1000" y="600" width="900" height="200" rx="12" fill="#EAF1FC" stroke="#285382" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="641.4">EnsureFrontendRequestsAreStateful</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="680.6">Preparación del grupo API · Sanctum</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="738.4">SPA: cookies, sesión, CSRF y SesionPestana</tspan><tspan x="1450" y="772">Otros orígenes omiten la subcadena SPA</tspan></text><rect x="100" y="600" width="650" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="425" y="641.4">SesionPestana</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="680.6">Control propio dentro de la subcadena SPA</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="425" y="738.4">Comprueba la credencial de la pestaña</tspan><tspan x="425" y="772">Se ejecuta antes de Authenticate</tspan></text><rect x="2350" y="600" width="650" height="180" rx="12" fill="#F6F8FA" stroke="#52606D" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="641.4">Interrupción en la subcadena</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="680.6">Respuesta de error propagada</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="745.2">401 si falla la sesión de pestaña</tspan></text><rect x="1000" y="950" width="900" height="180" rx="12" fill="#EAF1FC" stroke="#285382" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="991.4">Authenticate</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1030.6">Autenticación · guard sanctum</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1095.2">Exige una identidad autenticada</tspan></text><rect x="2350" y="950" width="650" height="180" rx="12" fill="#F6F8FA" stroke="#52606D" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="991.4">HTTP 401</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="1030.6">Cadena interrumpida</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="1095.2">No existe identidad autenticada</tspan></text><rect x="1000" y="1300" width="900" height="200" rx="12" fill="#EAF1FC" stroke="#285382" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1341.4">SubstituteBindings</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1380.6">Middleware de enlace de parámetros</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1438.4">Orden efectivo del grupo de ruta</tspan><tspan x="1450" y="1472">Esta ruta no contiene parámetros</tspan></text><rect x="1000" y="1650" width="900" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1691.4">CuentaActiva</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1730.6">Manejador propio de seguridad</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1788.4">Comprueba estado activo</tspan><tspan x="1450" y="1822">Comprueba cambio inicial de contraseña</tspan></text><rect x="2350" y="1650" width="650" height="200" rx="12" fill="#F6F8FA" stroke="#52606D" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="1691.4">HTTP 401 / 403</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="1730.6">Cadena interrumpida</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="1788.4">401: cuenta bloqueada</tspan><tspan x="2675" y="1822">403: cambio inicial pendiente</tspan></text><rect x="1000" y="2000" width="900" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="2041.4">RequireRole</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="2080.6">Manejador propio de autorización</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="2138.4">Parámetro de ruta: admin</tspan><tspan x="1450" y="2172">Exige rol administrador</tspan></text><rect x="2350" y="2000" width="650" height="180" rx="12" fill="#F6F8FA" stroke="#52606D" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="2041.4">HTTP 403</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="2080.6">Cadena interrumpida</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2675" y="2145.2">El usuario no tiene el rol requerido</tspan></text><rect x="1000" y="2350" width="900" height="200" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="2391.4">KichwaAdminController</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="2430.6">Destino de la cadena</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="2488.4">overview()</tspan><tspan x="1450" y="2522">Solo se alcanza si los controles permiten continuar</tspan></text><polyline points="1450,430 1450,600" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="1348.5" y="497" width="203" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="521.6">entra al pipeline</tspan></text><polyline points="1000,700 750,700" fill="none" stroke="#334B5E" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#open)"/><rect x="779" y="642" width="192" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="875" y="666.6">incluye para SPA</tspan></text><polyline points="1900,700 2350,700" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2023.5" y="642" width="203" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2125" y="666.6">subcadena rechaza</tspan></text><polyline points="1450,800 1450,950" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="1359.5" y="857" width="181" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="881.6">$next($request)</tspan></text><polyline points="1450,1130 1450,1300" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="1359.5" y="1197" width="181" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1221.6">$next($request)</tspan></text><polyline points="1450,1500 1450,1650" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="1359.5" y="1557" width="181" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1581.6">$next($request)</tspan></text><polyline points="1450,1850 1450,2000" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="1359.5" y="1907" width="181" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="1931.6">$next($request)</tspan></text><polyline points="1450,2200 1450,2350" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="1359.5" y="2257" width="181" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1450" y="2281.6">$next($request)</tspan></text><polyline points="1900,1040 2350,1040" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2045.5" y="992" width="159" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2125" y="1016.6">sin identidad</tspan></text><polyline points="1900,1750 2350,1750" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2018" y="1702" width="214" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2125" y="1726.6">control incumplido</tspan></text><polyline points="1900,2100 2350,2100" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2040" y="2052" width="170" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2125" y="2076.6">rol incorrecto</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="100" y="1235">Orden de ruta resuelto con el Router</tspan><tspan x="100" y="1270">de la instalación actual de Yachay.</tspan><tspan x="100" y="1305"></tspan><tspan x="100" y="1340">La subcadena SPA se ejecuta dentro</tspan><tspan x="100" y="1375">de Sanctum; no se añade al mismo</tspan><tspan x="100" y="1410">nivel que los demás manejadores.</tspan><tspan x="100" y="1445"></tspan><tspan x="100" y="1480">Se omiten los middleware globales</tspan><tspan x="100" y="1515">y el retorno de la respuesta para</tspan><tspan x="100" y="1550">centrar la lectura en esta ruta.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="2720.8">Orden verificado: Sanctum → Authenticate → SubstituteBindings → CuentaActiva → RequireRole → acción.</tspan><tspan x="70" y="2753">La cadena es específica de esta ruta administrativa; no todas las rutas de Yachay usan estos controles.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="2817.6">Flujo: flechas verticales = continuación; flechas a la derecha = interrupción; dependencia lateral = detalle de la subcadena SPA.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="122" y="2879.6">Yachay</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="662" y="2879.6">Laravel / Sanctum</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1202" y="2879.6">Dependencia externa</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1872" y="2879.6">Flujo / explicación</tspan></text></svg>