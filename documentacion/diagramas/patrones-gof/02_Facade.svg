<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2090" viewBox="0 0 3000 2090" role="img" aria-label="Facade"><title>Yachay · Facade</title><defs><marker id="open" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#334B5E" stroke-width="2.5"/></marker><marker id="triangle" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="20" markerHeight="20" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L19,10 L1,19 Z" fill="#FFFFFF" stroke="#334B5E" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#182B3A" text-anchor="start"><tspan x="70" y="90.6">Facade</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="158.5">Fachada funcional de comunicación · Clientes reales e integración de subsistemas</tspan></text><rect x="950" y="210" width="850" height="1490" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="2" stroke-dasharray="10 8"/><text font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#182B3A" text-anchor="start"><tspan x="975" y="252.8">api.ts · fachada funcional</tspan></text><rect x="70" y="2010" width="35" height="26" fill="#E9F5EC" stroke="#285C3C" stroke-width="2" /><rect x="610" y="2010" width="35" height="26" fill="#EAF1FC" stroke="#285382" stroke-width="2" /><rect x="1150" y="2010" width="35" height="26" fill="#F3EDFC" stroke="#62418B" stroke-width="2" /><rect x="1820" y="2010" width="35" height="26" fill="#F6F8FA" stroke="#52606D" stroke-width="2" /><rect x="100" y="300" width="600" height="180" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="400" y="341.4">GuidedUnit</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="400" y="380.6">Cliente de la fachada</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="400" y="445.2">Envía respuestas de ejercicios</tspan></text><rect x="100" y="730" width="600" height="180" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="400" y="771.4">useApi()</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="400" y="810.6">Cliente de la fachada</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="400" y="875.2">Consulta datos para las vistas</tspan></text><rect x="1000" y="300" width="700" height="300" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1350" y="341.4">Operaciones exportadas</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1350" y="380.6">Interfaz simplificada</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1350" y="488.4">apiGet() · apiPost()</tspan><tspan x="1350" y="522">apiPatch() · apiDelete()</tspan></text><rect x="1000" y="900" width="700" height="250" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="1350" y="941.4">apiRequest()</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1350" y="980.6">Coordinador central de la fachada</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1350" y="1046.6">Prepara y envía la solicitud</tspan><tspan x="1350" y="1080.1999999999998">Interpreta respuesta o ApiError</tspan><tspan x="1350" y="1113.8">Coordina efectos posteriores</tspan></text><rect x="2300" y="270" width="600" height="150" rx="12" fill="#F3EDFC" stroke="#62418B" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="311.4">Cookie y endpoint CSRF</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="350.6">Soporte de protección HTTP</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="400.2">Lectura y preparación del token</tspan></text><rect x="2300" y="520" width="600" height="150" rx="12" fill="#E9F5EC" stroke="#285C3C" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="561.4">tabSessionToken()</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="600.6">Servicio de credencial de pestaña</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="650.2">Aporta la cabecera de sesión</tspan></text><rect x="2300" y="900" width="600" height="150" rx="12" fill="#F3EDFC" stroke="#62418B" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="941.4">Fetch</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="980.6">Transporte HTTP del navegador</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="1030.2">Envía JSON o datos multipart</tspan></text><rect x="2300" y="1280" width="600" height="150" rx="12" fill="#F3EDFC" stroke="#62418B" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="1321.4">queryClient</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="1360.6">Caché de TanStack Query</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="1410.2">Invalida consultas afectadas</tspan></text><rect x="2300" y="1530" width="600" height="150" rx="12" fill="#F3EDFC" stroke="#62418B" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="1571.4">Eventos del navegador</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="1610.6">Aviso de sesión vencida</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2600" y="1660.2">Publica yachay:session-expired</tspan></text><polyline points="700,390 1000,390" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="792.5" y="342" width="115" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="850" y="366.6">apiPost()</tspan></text><polyline points="700,820 850,820 850,540 1000,540" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="798" y="662" width="104" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="850" y="686.6">apiGet()</tspan></text><polyline points="1350,600 1350,900" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="1303.5" y="732" width="93" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="1350" y="756.6">delegan</tspan></text><polyline points="1700,935 1900,935 1900,345 2300,345" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2143.5" y="327" width="93" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2190" y="351.6">prepara</tspan></text><polyline points="1700,980 2000,980 2000,595 2300,595" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2143.5" y="577" width="93" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2190" y="601.6">obtiene</tspan></text><polyline points="1700,1025 2100,1025 2100,975 2300,975" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2150" y="957" width="80" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2190" y="981.6">envía</tspan></text><polyline points="1700,1070 2000,1070 2000,1355 2300,1355" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2138" y="1337" width="104" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2190" y="1361.6">invalida</tspan></text><polyline points="1700,1115 1900,1115 1900,1605 2300,1605" fill="none" stroke="#334B5E" stroke-width="2.5"  marker-end="url(#open)"/><rect x="2105" y="1587" width="170" height="36" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="middle"><tspan x="2190" y="1611.6">avisa ante 401</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="100" y="1370">Una interfaz breve oculta la coordinación de</tspan><tspan x="100" y="1405">transporte, CSRF, sesión, errores y caché.</tspan><tspan x="100" y="1440">Las funciones exportadas son funciones reales,</tspan><tspan x="100" y="1475">no métodos de una clase ficticia.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="1870.8">CSRF se prepara al mutar si falta la cookie. Las consultas se invalidan según la operación realizada.</tspan><tspan x="70" y="1903">El evento de sesión vencida se emite ante determinados errores 401; los efectos no ocurren en todas las solicitudes.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="70" y="1967.6">Notación de componentes funcionales: flechas = uso y coordinación; los bloques no implican clases TypeScript.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="122" y="2029.6">Yachay</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="662" y="2029.6">Laravel / Sanctum</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1202" y="2029.6">Dependencia externa</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#182B3A" text-anchor="start"><tspan x="1872" y="2029.6">Flujo / explicación</tspan></text></svg>